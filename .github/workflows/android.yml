name: Android APK

on:
  push:
    branches: ["**"]
    paths-ignore: ["web/**", "README.md"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - uses: android-actions/setup-android@v3

      - uses: gradle/actions/setup-gradle@v4

      - name: Build APK
        run: |
          chmod +x gradlew
          ./gradlew assembleRelease --no-daemon
          cp app/build/outputs/apk/release/app-release.apk TodoAlarm.apk

      - uses: actions/upload-artifact@v4
        with:
          name: TodoAlarm-apk
          path: TodoAlarm.apk

      # 휴대폰에서 바로 받을 수 있도록 Releases 에도 올림
      - uses: softprops/action-gh-release@v2
        with:
          tag_name: apk-${{ github.run_number }}
          name: 할일 알람 APK (#${{ github.run_number }})
          target_commitish: ${{ github.sha }}
          files: TodoAlarm.apk
          body: 휴대폰에서 TodoAlarm.apk 를 받아 설치하세요.
